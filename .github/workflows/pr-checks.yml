# PR checks, called from each repository's .github/workflows/pr-checks.yml (installed from
# workflows/pr-checks.yml) pinned at @v1: `checks` (install, lint, typecheck) and `conventions`
# (branch name, PR title, which branches may merge into the default branch). Keep the job ids: the
# rulesets require `<caller job> / checks` and `<caller job> / conventions`. Rules in RELEASING.md.
#
# Inputs (the caller passes its repository variables; empty = default):
#   checks_dirs     space-separated folders with a package.json (default: the root one, else
#                   every package.json up to two folders deep)
#   checks_scripts  package.json scripts to run (default: "lint typecheck type-check"; missing
#                   ones are skipped)
#   ticket_pattern  regex for ticket ids (default: [A-Z][A-Z0-9]+-\d+, e.g. ABC-12)
name: PR checks

on:
  workflow_call:
    inputs:
      checks_dirs:
        type: string
        default: ''
      checks_scripts:
        type: string
        default: 'lint typecheck type-check'
      ticket_pattern:
        type: string
        default: ''

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install, lint, typecheck
        env:
          CHECKS_DIRS: ${{ inputs.checks_dirs }}
          CHECKS_SCRIPTS: ${{ inputs.checks_scripts || 'lint typecheck type-check' }}
        run: |
          set -euo pipefail
          run() { if [ -n "${CHECKS_DRY_RUN:-}" ]; then echo "+ $*"; else "$@"; fi; }
          if [ -n "${CHECKS_DIRS:-}" ]; then
            dirs=$(printf '%s\n' $CHECKS_DIRS)
          elif [ -f package.json ]; then
            dirs=.
          else
            dirs=$(find . -mindepth 2 -maxdepth 3 -name package.json -not -path '*/node_modules/*' -printf '%h\n' | sort)
          fi
          if [ -z "$dirs" ]; then
            echo "::notice::No package.json found; nothing to install, lint or typecheck."
            exit 0
          fi
          while IFS= read -r dir; do
            echo "::group::$dir"
            (
              cd "$dir"
              if [ -f pnpm-lock.yaml ]; then pm=pnpm; run corepack enable; run pnpm install --frozen-lockfile
              elif [ -f yarn.lock ] && [ -f .yarnrc.yml ]; then pm=yarn; run corepack enable; run yarn install --immutable
              elif [ -f yarn.lock ]; then pm=yarn; run yarn install --frozen-lockfile
              elif [ -f package-lock.json ]; then pm=npm; run npm ci
              else pm=npm; run npm install
              fi
              for script in $CHECKS_SCRIPTS; do
                if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$script"; then
                  run "$pm" run "$script"
                else
                  echo "no \"$script\" script in $dir/package.json; skipped"
                fi
              done
            )
            echo "::endgroup::"
          done <<< "$dirs"

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Branch name, PR title, merge target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TICKET_PATTERN: ${{ inputs.ticket_pattern }}
        run: node .release-kit/release.mjs conventions --no-fetch

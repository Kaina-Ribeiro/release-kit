# PR checks, called from each repository's .github/workflows/pr-checks.yml (installed from
# workflows/pr-checks.yml) pinned at @v1: `checks` (install, lint, typecheck) and `conventions`
# (branch name, PR title, which branches may merge into the default branch). Keep the job ids: the
# rulesets require `<caller job> / checks` and `<caller job> / conventions`. Rules in RELEASING.md.
#
# Inputs (the caller passes its repository variables; empty = default):
#   checks_command  the project's own check (e.g. "make lint"), run from the project's root with
#                   bash -euo pipefail -c; when set, it replaces the Node flow below (checks.sh)
#   checks_dirs    space-separated folders with a package.json (default: the root one, else
#                   every package.json up to two folders deep)
#   checks_scripts  package.json scripts to run (default: "lint typecheck type-check"; missing
#                   ones are skipped)
#   ticket_pattern  regex for ticket ids (default: [A-Z][A-Z0-9]+-\d+, e.g. ABC-12)
name: PR checks

on:
  workflow_call:
    inputs:
      checks_command:
        type: string
        default: ''
      checks_dirs:
        type: string
        default: ''
      checks_scripts:
        type: string
        default: 'lint typecheck type-check'
      ticket_pattern:
        type: string
        default: ''

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      # Out of the workspace, so a CHECKS_COMMAND that scans the whole folder (eslint ., ruff
      # check .) never sees the kit's own files.
      - name: Move the kit out of the project
        run: mv .release-kit "$RUNNER_TEMP/release-kit"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install, lint, typecheck
        env:
          CHECKS_COMMAND: ${{ inputs.checks_command }}
          CHECKS_DIRS: ${{ inputs.checks_dirs }}
          CHECKS_SCRIPTS: ${{ inputs.checks_scripts || 'lint typecheck type-check' }}
        run: bash "$RUNNER_TEMP/release-kit/checks.sh"

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Branch name, PR title, merge target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TICKET_PATTERN: ${{ inputs.ticket_pattern }}
        run: node .release-kit/release.mjs conventions --no-fetch

# Release automation, called from each repository's .github/workflows/release.yml (installed from
# workflows/release.yml) pinned at @v1: rc tags and sync PRs on version lines, a test-stage deploy
# of each rc, final tags on release day, manual cuts and deploys. Every job checks out the calling
# repository, then this kit at the exact commit the caller resolved (job.workflow_sha), and runs
# that release.mjs. Rules in RELEASING.md.
#
# github.event, github.ref and github.token are the caller's. Variables and secrets come in as
# inputs: the caller passes each one explicitly.
#
# When rc, deploy-test, final or cleanup fails, the report job opens one issue per job and line
# ("Release automation failing: <job> on <line>", label release-kit) with the error from release.mjs
# (each job's `error` output); the next failure comments on it and the next success closes it.
#
# Token: secrets.release_token if set (a GitHub App token or an admin's fine-grained PAT), else the
# caller's GITHUB_TOKEN. With GITHUB_TOKEN, sync PRs, tags and branches it creates do not trigger
# other workflows, so required checks never run on sync PRs. See RELEASING.md, "Setup".
# Deploys (optional): cubeship_url, deploy_test_apps, deploy_prod_apps and secrets.cubeship_token.
# Without deploy_*_apps nothing is deployed. A deploy fails unless each app's container stays up
# afterwards; health_stable_s / health_wait_s tune that.
name: Release

on:
  workflow_call:
    inputs:
      command:
        description: 'dispatch only: cut-release, cut-hotfix or deploy'
        type: string
        default: ''
      version:
        description: 'cut-release only: force X.Y (e.g. 1.0). Empty = next minor.'
        type: string
        default: ''
      stage:
        description: 'deploy only: test or prod'
        type: string
        default: test
      tag:
        description: 'deploy only: the tag. Empty = last rc of the branch you run from (or the tag you run from).'
        type: string
        default: ''
      dry_run:
        description: Only print what would happen
        type: boolean
        default: false
      cubeship_url:
        type: string
        default: ''
      deploy_test_apps:
        type: string
        default: ''
      deploy_prod_apps:
        type: string
        default: ''
      health_stable_s:
        type: string
        default: ''
      health_wait_s:
        type: string
        default: ''
    secrets:
      release_token:
        required: false
      cubeship_token:
        required: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  GH_TOKEN: ${{ secrets.release_token || github.token }}
  CUBESHIP_URL: ${{ inputs.cubeship_url }}
  CUBESHIP_TOKEN: ${{ secrets.cubeship_token }}
  DEPLOY_TEST_APPS: ${{ inputs.deploy_test_apps }}
  DEPLOY_PROD_APPS: ${{ inputs.deploy_prod_apps }}
  RELEASE_HEALTH_STABLE_S: ${{ inputs.health_stable_s }}
  RELEASE_HEALTH_WAIT_S: ${{ inputs.health_wait_s }}

jobs:
  rc:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      # This line's rc on the pushed commit; empty when the commit already carried another release
      # tag (a cut: no new code), so deploy-test is skipped.
      tag: ${{ steps.rc.outputs.tag }}
      error: ${{ steps.rc.outputs.error || steps.sync.outputs.error }}
    concurrency:
      group: release-line-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.release_token || github.token }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Tag release candidate
        id: rc
        run: node .release-kit/release.mjs rc --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Open sync PR
        id: sync
        run: node .release-kit/release.mjs sync --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

  deploy-test:
    needs: rc
    if: inputs.deploy_test_apps != '' && needs.rc.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.deploy.outputs.error }}
    concurrency:
      group: release-deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Deploy the line's last rc to the test stage
        id: deploy
        run: node .release-kit/release.mjs deploy --stage test --branch "$GITHUB_REF_NAME"

  final:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (startsWith(github.event.pull_request.head.ref, 'release/v') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.final.outputs.error }}
    concurrency:
      group: release-final
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.release_token || github.token }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Tag final release
        id: final
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node .release-kit/release.mjs final --head "$HEAD_REF" --sha "$MERGE_SHA"

  cleanup:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.base.ref, 'release/v') ||
       startsWith(github.event.pull_request.base.ref, 'hotfix/v'))
    runs-on: ubuntu-latest
    outputs:
      error: ${{ steps.cleanup.outputs.error }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.release_token || github.token }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Delete the merged branch
        id: cleanup
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node .release-kit/release.mjs cleanup --head "$HEAD_REF" --base "$BASE_REF"

  # One issue per automatic job and line while it keeps failing; closed by its next success. The
  # line: the pushed branch (rc, deploy-test), the merged line (final) or the line merged into
  # (cleanup). Manual runs (deploy, cut) are not reported: whoever ran them sees the failure.
  report:
    needs: [rc, deploy-test, final, cleanup]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Open, update or close the failure issues
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result, (.value.outputs.error // "")] | @tsv' |
          while IFS=$'\t' read -r job result error; do
            case $job in final) line=$PR_HEAD ;; cleanup) line=$PR_BASE ;; *) line=$REF_NAME ;; esac
            node .release-kit/release.mjs report --job "$job" --line "$line" --result "$result" --run-url "$RUN_URL" --error "$error"
          done

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'deploy'
    runs-on: ubuntu-latest
    concurrency:
      group: release-deploy-${{ inputs.stage }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Deploy
        env:
          STAGE: ${{ inputs.stage }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(deploy --stage "$STAGE")
          if [ -n "$TAG" ]; then args+=("$TAG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node .release-kit/release.mjs "${args[@]}"

  cut:
    if: github.event_name == 'workflow_dispatch' && inputs.command != 'deploy'
    runs-on: ubuntu-latest
    concurrency:
      group: release-cut
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.release_token || github.token }}
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-kit
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Cut version line
        env:
          COMMAND: ${{ inputs.command }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("$COMMAND")
          if [ -n "$VERSION" ]; then args+=(--version "$VERSION"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node .release-kit/release.mjs "${args[@]}"
